<div id="root"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get as dbGet, set as dbSet } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTn1vg83gfMDzOfDTJqFxjhuLae-gj5EE",
    authDomain: "carolyn-lash.firebaseapp.com",
    databaseURL: "https://carolyn-lash-default-rtdb.firebaseio.com",
    projectId: "carolyn-lash",
    storageBucket: "carolyn-lash.firebasestorage.app",
    messagingSenderId: "964397564829",
    appId: "1:964397564829:web:20cb6a014cefa3b46c2574"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const auth = getAuth(fbApp);

  function safeKey(key) {
    return String(key).replace(/[.#$\[\]/]/g, "_");
  }

  window.storage = {
    async get(key) {
      const snap = await dbGet(ref(db, safeKey(key)));
      if (!snap.exists()) return null;
      return { key, value: snap.val(), shared: true };
    },
    async set(key, value) {
      await dbSet(ref(db, safeKey(key)), value);
      return { key, value, shared: true };
    },
  };

  signInAnonymously(auth).catch((err) => {
    console.error("Falha na autenticação anônima do Firebase:", err);
    document.getElementById("root").innerHTML =
      '<div style="padding:40px 20px;color:#241F18;background:#FFFFFF;min-height:100vh;font-family:sans-serif;text-align:center">Não foi possível conectar ao banco de dados. Verifique a conexão com a internet e recarregue a página.</div>';
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.dispatchEvent(new Event("firebase-ready"));
    }
  });
</script>

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDateLabel(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const weekday = date.toLocaleDateString("pt-BR", {
    weekday: "short"
  });
  return {
    weekday: weekday.replace(".", ""),
    day: d,
    month: date.toLocaleDateString("pt-BR", {
      month: "short"
    }).replace(".", "")
  };
}
function fmtDateFull(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString("pt-BR", {
    weekday: "long",
    day: "2-digit",
    month: "long"
  });
}
function money(n) {
  return (n || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}
function computeDeposit(price, settings) {
  if (!settings.depositEnabled) return 0;
  if (settings.depositType === "fixed") return Math.min(settings.depositValue || 0, price);
  return Math.round(price * ((settings.depositValue || 0) / 100) * 100) / 100;
}

// Same fixed time-slot list every day (morning + afternoon block, 30min steps)
function isClosedDay(iso, settings) {
  const [y, m, d] = iso.split("-").map(Number);
  const weekday = new Date(y, m - 1, d).getDay(); // 0 = domingo
  return (settings.closedDays || []).includes(weekday);
}
function hoursForDate(iso, settings) {
  if (isClosedDay(iso, settings)) return [];
  return settings.timeSlots;
}
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
